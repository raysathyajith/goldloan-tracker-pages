<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google-site-verification" content="Ffd6RUk6Vsh6X3UzP-5JB0_w6zdwFNyDLYtehbl4Mmo" />
<title>DueGold: Gold Loan Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f8faff;
    --fg: #0d1117;
    --muted: #6b7a99;
    --card: #ffffff;
    --border: #e2e8f0;
    --primary: #1a56db;
    --accent: #d97706;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0b0f1a;
      --fg: #f1f5f9;
      --muted: #94a3b8;
      --card: #151b28;
      --border: #263143;
      --primary: #3b82f6;
      --accent: #f59e0b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    line-height: 1.65;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 64px 24px 96px; text-align: center; }
  .eyebrow { color: var(--accent); font-size: 12px; font-weight: 600; letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 12px; }
  h1 { font-size: 32px; font-weight: 700; margin: 0 0 16px; }
  .tagline { color: var(--muted); font-size: 16px; margin-bottom: 40px; }
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-width: 320px;
    margin: 0 auto;
  }
  .links a {
    display: block;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 20px;
    color: var(--fg);
    text-decoration: none;
    font-weight: 500;
    font-size: 15px;
  }
  .links a:hover { border-color: var(--primary); }
  footer { margin-top: 56px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Gold Loan Manager</div>
  <h1>DueGold: Gold Loan Tracker</h1>
  <p class="tagline">Track gold loans, repayments, due dates, and pledged jewellery details — all in one place.</p>
  <div class="links">
    <a href="./privacy-policy.html">Privacy Policy</a>
    <a href="./delete-account.html">Account &amp; Data Deletion</a>
  </div>
  <footer>DueGold: Gold Loan Tracker</footer>
</div>
</body>
</html>
